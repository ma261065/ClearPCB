name: Regression Checks

on:
  push:
    branches: [dev, 'release_*']
  pull_request:
    branches: [dev, 'release_*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression gate
        run: node tools/regression.mjs

  typecheck:
    # The baseline (tools/typecheck-baseline.json) is empty: any type error fails.
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Type check src/
        run: node tools/typecheck.mjs

  browser:
    # Real app in headless Chromium: pointer input, WebGL 3D view, Properties, autosave recovery.
    # Four parallel jobs each run every fourth scenario (tools/browser-test.mjs --shard).
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        # The runner's Azure Ubuntu mirror sometimes stalls apt for minutes, which once held
        # shards until the job timed out. Short apt network timeouts make a stalled mirror
        # fail fast; a failed attempt stops apt, waits for its locks and tries again.
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
          for attempt in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed or stalled."
            sudo pkill -f apt-get || true
            for wait in $(seq 30); do
              sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend > /dev/null 2>&1 || break
              sleep 2
            done
          done
          exit 1
      - name: Run browser tests
        run: node tools/browser-test.mjs --shard=${{ matrix.shard }}/4
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures-${{ matrix.shard }}
          path: browser-test-failure-*.png
          if-no-files-found: ignore
