name: Regression Checks

on:
  push:
    branches: [dev, 'release_*']
  pull_request:
    branches: [dev, 'release_*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression gate
        run: node tools/regression.mjs

  typecheck:
    # The baseline (tools/typecheck-baseline.json) is empty: any type error fails.
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Type check src/
        run: node tools/typecheck.mjs

  browser:
    # Real app in headless Chromium: pointer input, WebGL 3D view, Properties, autosave recovery.
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: node tools/browser-test.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: browser-test-failure-*.png
          if-no-files-found: ignore
