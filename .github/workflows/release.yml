name: Publish Stable Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: stable-pages
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Validate stable release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Stable releases must use tags such as v1.0.0.' >&2
            exit 1
          fi
          series="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git fetch origin "refs/heads/release_$series:refs/remotes/origin/release_$series"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/release_$series"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo 'Only the release marked Latest may replace the stable site.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package site
        run: node tools/package-release.mjs "$RELEASE_TAG"
      - name: Attach downloadable release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -q -r "../ClearPCB-$RELEASE_TAG.zip" .
          cd ..
          gh release upload "$RELEASE_TAG" "ClearPCB-$RELEASE_TAG.zip" --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this is still the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
      - uses: actions/configure-pages@v5
      - name: Deploy stable site
        id: deployment
        uses: actions/deploy-pages@v4